# Memoria acotada a propósito: el equipo tiene 15,7 GB y buena parte está
# ocupada por Docker y el editor. Sin este límite, el demonio de Gradle pide
# más de lo disponible y el sistema lo mata a mitad de la compilación
# ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.daemon=false

android.useAndroidX=true
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
